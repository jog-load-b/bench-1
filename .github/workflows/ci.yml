name: ci
# takeover-press-1124 (design §11): market-benchmark's bench/ci.yml less its push trigger and its flaky-once step.
# One job, about 3 minutes. Jog Merge tests by test pull requests here, so pull_request covers its tests. It fails
# when the checked-out tree holds both files of a clash pair. Its last step prints the tree's id.
on:
  pull_request:
  merge_group:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          sleep 170
          bad=0
          for a in $(find . -path ./.git -prune -o -name '*.clash-a' -print); do
            if [ -e "${a%.clash-a}.clash-b" ]; then echo "both sides of ${a%.clash-a} are here"; bad=1; fi
          done
          exit $bad
      - name: tree
        if: always()
        run: echo "BENCH_TREE=$(git rev-parse 'HEAD^{tree}')"
