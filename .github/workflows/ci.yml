name: ci
# market-benchmark (PLAN.md v2 §2): one job, about 3 minutes, on GitHub's runners. One trigger per test:
# pull_request (a PR's own CI), merge_group (GitHub's queue), pushes to jog-merge/** (Jog Merge's queue tests).
# The sleep comes first, so a failure costs as much as a pass. It fails when the checked-out tree holds both
# files of a clash pair. Its last step prints the tree's id.
on:
  pull_request:
  merge_group:
  push:
    branches: ["jog-merge/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: b092-coe
        # B-092 v2 r3.2 (AFT L8, test org only): b092-coe fails under continue-on-error when a PR's own
        # r/b092-1126b/<k>/COE is in the tree (#8533's capture); b092-fault then kills the job's own hosted runner,
        # as it does while bench/b092-1126b/fault exists or a PR's own FAULT is in the tree
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/jog-merge/main/')
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "$(find ./r/b092-1126b -name COE -type f -print -quit 2>/dev/null)" ]; then echo "b092-coe: failing, continue-on-error"; exit 1; fi
          echo "b092-coe: nothing to do"
      - name: b092-fault
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/jog-merge/main/')
        shell: bash
        run: |
          ref="refs/heads/bench/b092-1126b/fault"; why=""; closed=""
          if [ -n "$(find ./r/b092-1126b \( -name FAULT -o -name COE \) -type f -print -quit 2>/dev/null)" ]; then why="a PR's FAULT or COE file"; fi
          if [ -z "$why" ]; then
            rc=1
            for i in 1 2 3; do
              timeout 20 git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}" "$ref" >/dev/null 2>&1 && rc=0 || rc=$?
              if [ "$rc" = 0 ] || [ "$rc" = 2 ]; then break; fi
              sleep 5
            done
            case "$rc" in 0) why="$ref";; 2) ;; *) closed="$rc";; esac
          fi
          if [ -n "$closed" ]; then echo "::notice::b092-fault: failing closed (exit $closed)"; exit 1; fi
          if [ -z "$why" ]; then echo "b092-fault: no fault"; exit 0; fi
          echo "b092-fault: $why: stopping this job's own runner"
          if ! sudo -n pkill -KILL -f 'Runner[.](Listener|Worker)'; then echo "::notice::b092-fault: the runner kill failed"; exit 1; fi
          sleep 300
          echo "::notice::b092-fault: the runner kill didn't take"
          exit 1
      - name: build
        run: |
          sleep 170
          bad=0
          for a in $(find . -path ./.git -prune -o -name '*.clash-a' -print); do
            if [ -e "${a%.clash-a}.clash-b" ]; then echo "both sides of ${a%.clash-a} are here"; bad=1; fi
          done
          exit $bad
      # Fail-once (#6886's 43 -> 44 proof; the lead OK'd 18 Nov): a run fails ONLY on attempt 1, and only while its tree
      # holds a marker file under some flaky-once/ folder whose "until=<epoch seconds>" line is still in the future.
      # The proof's manifest writes the marker with until = about an hour ahead. So the re-run passes, and once the hour
      # is over every run is inert again. No fetch, no history: other rows pay one find over the tree.
      - name: flaky-once
        # only Jog Merge's merge tests (pushes to jog-merge/**), never a PR's own CI (pull_request) or GitHub's merge
        # group: failing a PR's own CI makes a red PR, not a flaky test (18 Nov dry run r1795019637-J, #1382)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/jog-merge/')
        shell: bash
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          now=$(date +%s); live=""
          while IFS= read -r -d '' f; do
            until=$(awk -F= '/^until=[0-9]+$/ { print $2; exit }' "$f")
            if [ -n "$until" ] && [ "$now" -lt "$until" ]; then live="$live $f"; fi
          done < <(find . -path ./.git -prune -o -path '*/flaky-once/*' -type f -print0)
          if [ -z "$live" ]; then echo "flaky-once: no live marker in this tree, nothing to do"; exit 0; fi
          if [ "$ATTEMPT" != "1" ]; then echo "flaky-once: attempt $ATTEMPT with live marker(s)$live: passing"; exit 0; fi
          echo "flaky-once: attempt 1 with live marker(s)$live: failing once so Jog asks for a rerun"; exit 1
      - name: tree
        if: always()
        run: echo "BENCH_TREE=$(git rev-parse 'HEAD^{tree}')"
