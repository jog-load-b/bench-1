name: ci
# market-benchmark, the yield_to_ready row only (15 Nov; put back to bench/ci.yml after the row). One job on GitHub's
# runners, as the benchmark's, with two timings a pull request's own files choose: a merge test (a push to
# jog-merge/**) that holds a NEW file r/<tag>/<id>.hold-<seconds> sleeps that long, and a pull request's own CI that
# holds a NEW file r/<tag>/<id>.slow-<seconds> sleeps that long ("new" = not on main yet, so a merged PR's marker
# times nothing after it). Anything else sleeps 170 s. A tree holding both files of a clash pair fails, as before.
on:
  pull_request:
  merge_group:
  push:
    branches: ["jog-merge/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          git fetch --no-tags --depth=1 origin main
          git ls-tree -r --name-only FETCH_HEAD > /tmp/on-main
          kind=""
          case "$GITHUB_EVENT_NAME" in
            push) kind=hold ;;
            pull_request) kind=slow ;;
          esac
          wait=170
          if [ -n "$kind" ]; then
            for f in $(git ls-files "r/*.${kind}-*"); do
              if ! grep -qxF "$f" /tmp/on-main; then
                s="${f##*.${kind}-}"
                case "$s" in ''|*[!0-9]*) continue ;; esac
                if [ "$s" -gt "$wait" ] && [ "$s" -le 900 ]; then wait="$s"; fi
              fi
            done
          fi
          echo "BENCH_SLEEP=$wait ($GITHUB_EVENT_NAME)"
          sleep "$wait"
          bad=0
          for a in $(find . -path ./.git -prune -o -name '*.clash-a' -print); do
            if [ -e "${a%.clash-a}.clash-b" ]; then echo "both sides of ${a%.clash-a} are here"; bad=1; fi
          done
          exit $bad
      - name: tree
        if: always()
        run: echo "BENCH_TREE=$(git rev-parse 'HEAD^{tree}')"
